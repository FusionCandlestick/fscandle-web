name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The engine is a local file: dependency. In CI it is checked out
      # alongside this repo so `npm install` can link it.
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          repository: FusionCandlestick/fscandle
          path: ../FusionCandlestick

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Browser Frame Benchmark
        run: npm run build && npm run test:perf:browser
